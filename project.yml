name: RamenRadar
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 11.0.0
options:
  bundleIdPrefix: com.tokyonasu
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  defaultConfig: Release

configs:
  Debug: debug
  Release: release

targets:
  RamenRadar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RamenRadar
        excludes:
          - Info.plist
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - target: RamenRadarWatch
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.RamenRadar
        MARKETING_VERSION: 1.1
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 83VGKGSQUH
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: MenNavi iOS App Store
    info:
      path: RamenRadar/Info.plist
      properties:
        CFBundleName: MenNavi
        CFBundleDisplayName: 麺ナビ
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "近くのラーメン店を探すために位置情報を使用します"
        NSUserTrackingUsageDescription: "パーソナライズ広告のためにデータを使用します"
        GADApplicationIdentifier: "ca-app-pub-9404799280370656~5253018214"

  RamenRadarWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: RamenRadarWatch
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: RamenRadarWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.tokyonasu.RamenRadar.watch
        MARKETING_VERSION: 1.1
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: RamenRadarWatch/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 83VGKGSQUH
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: MenNavi Watch App Store
    info:
      path: RamenRadarWatch/Resources/Info.plist
      properties:
        CFBundleName: MenNavi Watch
        CFBundleDisplayName: 麺ナビ
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.tokyonasu.RamenRadar
        NSLocationWhenInUseUsageDescription: "近くのラーメン店を探すために位置情報を使用します。"
