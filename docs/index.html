<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麺ナビ - MenNavi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #0D1117; color: #F0F0F0; }
  .hero { text-align: center; padding: 60px 20px 40px; }
  .hero h1 { font-size: 2.5em; font-weight: 900; color: #E63946; letter-spacing: 2px; }
  .hero p { color: #FFD60A; margin-top: 8px; font-size: 1.1em; }
  .container { max-width: 600px; margin: 0 auto; padding: 0 20px 60px; }
  .feature { background: #161B22; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid rgba(230,57,70,0.2); }
  .feature h3 { color: #E63946; margin-bottom: 8px; }
  .feature p { color: #8B949E; line-height: 1.6; }
  a { color: #FFD60A; }
  .footer { text-align: center; padding: 40px 20px; color: #8B949E; font-size: 0.9em; }
  .footer a { color: #FFD60A; }
</style>
</head>
<body>
<div class="hero">
  <h1>麺ナビ</h1>
  <p>近くのうまいラーメン、見つけろ。</p>
</div>
<div class="container">
  <div class="feature">
    <h3>レーダースキャン</h3>
    <p>円形レーダーで周囲のラーメン店をスキャン。人気店は赤、あっさり系は青、深夜営業は黄色で表示。</p>
  </div>
  <div class="feature">
    <h3>今うまい店</h3>
    <p>時間帯に合わせておすすめが変化。昼は回転の速い店、深夜は営業中のこってり店を優先。</p>
  </div>
  <div class="feature">
    <h3>混雑ヒートマップ</h3>
    <p>混んでる店は赤く光る。「並ぶ価値あり」か「今は避けろ」か、一目でわかる。</p>
  </div>
  <div class="feature">
    <h3>ワンタップナビ</h3>
    <p>「ここに行く」を押すだけ。Google Mapsが開いて徒歩ナビ開始。</p>
  </div>
</div>
<div class="footer">

</div>
